name: Krida
order: 5
year: 2026
status: building
logo: ./krida/logo.png
angle: 6
description: watch movies, shows and anime with friends, in sync
platforms: web, on desktop and phone
summary: >-
  krida is a private streaming app for me and a friend, built around watching together. a party keeps everyone's
  play, pause and seek in sync, waits for whoever is buffering, and has a shared queue and chat. it runs in the
  browser, on a laptop or a phone.
links:
  - label: open krida
    href: https://krida-tv.vercel.app/
previews:
  - src: ./krida/01-watch-party.webp
    alt: Krida player showing a dragon from Sintel, with the party panel open beside it, an up next title and a short chat
    title: watch party
    caption: the party sits beside the player. see who's watching, what's up next, and the chat.
  - src: ./krida/02-home.webp
    alt: Krida home with a featured show's title art, ratings and synopsis, and a continue watching row
    title: home
    caption: picks come from what you watch and rate, with what you're halfway through right under them.
  - src: ./krida/03-title.webp
    alt: Krida title page for Interstellar with play, trailer, plan to watch, rate and watch together
    title: a title
    caption: watch together sits right next to play.
  - src: ./krida/04-wrapped.webp
    alt: Krida wrapped reading 27 hours in other worlds over a wall of posters
    title: wrapped
    caption: a wrapped of everything you watched, whenever you want it.
  - src: ./krida/05-search.webp
    alt: Krida search for christopher nolan with his films in a row, one marked watched
    title: search
    caption: movies, shows and people in one place.
features:
  - title: watch parties that stay in sync
    body: play, pause and seek land for everyone. the party waits for whoever is buffering, with a shared queue, chat and meme sound reactions. a friend without a profile can join from a one-use link.
  - title: picks from your taste
    body: recommendations come from what you watch, save and rate, plus your Simkl history if you connect it. every title shows IMDb, Rotten Tomatoes, Metacritic and Letterboxd scores.
  - title: a player that gets out of the way
    body: point at the timeline and see a picture from that moment. skip the recap and intro in one go, jump past the credits to what's up next, and switch episodes without leaving the player.
  - title: a library that's yours
    body: plan to watch, watching, watched and to rate, with stats and a wrapped. it syncs both ways with Simkl, and private mode keeps what you watch off your friend's home.
story:
  - I wanted one place for a friend and me to pick something and actually watch it together, without counting down "3, 2, 1, play" over a call.
  - Convex ended up reading about three times what its free plan allows, mostly copies of the same public data. so I moved everything that's the same for everyone onto Vercel and kept each profile's data in the browser.
  - most of the time goes to the player, so most of the effort did too. next is the bigger version, with party sync built in, apps on every platform, and plugins.
stack:
  - name: React
    icon: siReact
    why: React 19 with Vite keeps it quick to load and quick to work on.
  - name: Convex
    icon: siConvex
    why: profiles, parties, chat and each profile's own data sync live without a server of my own.
  - name: Vercel
    icon: siVercel
    why: search, ratings, home rows and picks run as functions behind its cache, so public data never touches the database.
  - name: Cloudflare Workers
    icon: siCloudflareworkers
    why: the timeline pictures, one every 10 seconds, pulled from the film's own file.
  - name: hls.js
    why: adaptive streaming in the browser, with the player under my control.
  - name: Tailwind CSS
    icon: siTailwindcss
    why: fast to style, with the tokens in one place.
  - name: TMDB
    icon: siThemoviedatabase
    why: search, art, trending and similar titles, with ratings from MDBList on top.
architecture:
  - title: one clock for the room
    body: the party keeps a single playback state on the server. each player follows it, and nobody resumes until everyone has buffered.
  - title: one title, one id
    body: an anime has an IMDb id and a Kitsu id. krida treats them as one title, so a save, a rating or a status lands once and nothing shows up twice.
  - title: only what changed
    body: each profile's library, ratings and progress live in a copy in the browser. Convex sends only the rows that changed, and picks are worked out from that copy, then scored on Vercel.
