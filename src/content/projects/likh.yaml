  - src: ./likh/01-dictation.webp
    alt: Likh dictation settings with the Ctrl plus Space shortcut lit on a small keyboard, a mouse button option, hold or tap mode and stop after quiet
    title: dictation
    caption: pick the shortcut on the keyboard or use a mouse button, then how it starts and when it stops.
  - src: ./likh/02-welcome.webp
    alt: Likh welcome screen reading Talk. It types.
