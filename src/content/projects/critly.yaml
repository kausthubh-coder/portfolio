name: Critly
order: 3
year: 2026
status: live
logo: ./critly/logo.png
angle: -5
description: design concepts, skills and a check that help agents build better UI
platforms: web, skills for Claude Code, Codex and Cursor, and a cli on npm
license: MIT
summary: >-
  critly is a design tool for building with agents. it's a library of design concepts, each with the rule, real numbers
  and a demo you can toggle, plus skills that let your agent build and review UI with them, and a check that measures
  the running app and fails with the fix named.
links:
  - label: browse the library
    href: https://critly.vercel.app/
  - label: the check
    href: https://critly.vercel.app/check
  - label: github
    href: https://github.com/kausthubh-coder/critly
numbers:
  - value: "87"
    label: design concepts, each with a demo
  - value: "15"
    label: rules the check runs by default
  - value: "2"
    label: agent skills, generated from the library
previews:
  - src: ./critly/01-concept.webp
    alt: Critly concept page about tabular numbers with a toggleable demo
    title: a concept
    caption: one idea, one rule, and a demo you can flip between wrong and right.
  - src: ./critly/02-easings.webp
    alt: Critly easing concept in dark mode comparing ease-in and ease-out
    title: easing, side by side
    caption: the same 250ms menu with ease-in and ease-out, so you can feel the difference.
  - src: ./critly/03-phone.webp
    alt: Critly concept page on a phone in dark mode
    title: on a phone
    caption: the library reads just as well at 390px.
    mobile: true
features:
  - title: a library you can try
    body: concepts across type, colour, spacing, motion, states, sound and performance, each with real numbers and an interactive demo.
  - title: native apps too
    body: a mobile section for iOS and Android, with gestures, haptics, sheets, safe areas and the soft keyboard, for SwiftUI, Compose, Flutter and React Native.
  - title: skills for your agent
    body: critly builds and reviews UI with the concepts, and critly-audit audits a whole app and sets up the check. this site was redone with them.
  - title: a check it can't skip
    body: critly check opens your running app at phone and desktop widths, light and dark, and fails with the fix and the concept named, so an agent can't talk its way past it.
story:
  - writing code costs almost nothing now. design is the slow part. agents build UI that works but feels generic, with default easings, no states past the happy path, and off-scale spacing.
  - rules in a prompt get read once and forgotten. I wanted principles an agent actually uses while it builds, and a check it can't argue with.
stack:
  - name: Next.js
    icon: siNextdotjs
    why: every concept page is content, so it's all served static.
  - name: MDX
    icon: siMdx
    why: one typed source feeds the site and generates the skills.
  - name: Motion
    why: the demos need real springs.
  - name: Playwright
    why: the check measures the rendered page in a real browser, not the source.
architecture:
  - title: one source, two readers
    body: concepts are MDX files. the same content builds the site for people and the skill files for agents, and a github action regenerates the skill whenever the content changes, so they never drift.
  - title: demos are the argument
    body: each concept ships a wrong and a right version of the same component, so you feel the difference instead of reading about it.
  - title: one script, three places
    body: the check's rules are one file and one dependency-free script. the same script runs from the cli, inside playwright tests, and in an agent's browser tool, and every rule links back to its concept.
