name: Kriyan
order: 2
year: 2026
status: live
logo: ./kriyan/logo.png
angle: 5
description: open-source planner that lets the AI you already use plan with you
platforms: web, android, CLI and MCP
license: MIT
summary: >-
  kriyan is a calm planner for time boxing. everything you have to do goes in one place, you give it a time on your
  day, and the plan stays quiet enough to follow. the AI you already use, Claude, ChatGPT or Cursor, can plan with you
  through its MCP server, and nothing it suggests lands until you accept it. it's free and open source.
