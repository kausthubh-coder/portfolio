features:
  - title: your day on one timeline
    body: today shows what's next, your habits, anytime tasks and the free time left. drag tasks onto the timeline, and the week flags a day that has more work than hours.
  - title: type it like you'd say it
    body: 'quick-add turns "calculus lecture every tue and thu 9am for 1h30 #school/calculus" into a time, a length, a repeat and a space.'
  - title: repeats and reminders
    body: chosen weekdays, the 2nd tuesday of the month, yearly, or 3 days after it's done, until a date or a number of times. reminders reach your phone even if your AI added the task.
  - title: plan with the AI you already use
    body: add kriyan.app/mcp as a connector in Claude or ChatGPT and it can do anything the app can. it proposes a plan, the blocks show up outlined, and you accept or discard them.
story:
  - I wanted a planner that's mostly a timeline, where length is optional, and where the AI I already talk to can plan with me instead of being one more app to open.
  - the first version worked but got busy. so I rebuilt it in october to be calmer, with one Expo app for android and the web, spaces inside spaces, and plans from your AI that wait for a yes.
  - it's one backend with four ways in, and it's open source, so your data stays yours.
stack:
  - name: Expo
    icon: siExpo
    why: one app for android and the web, so they never drift apart.
  - name: Convex
    icon: siConvex
    why: one live backend shared by every surface.
  - name: Next.js
    icon: siNextdotjs
    why: the site, the docs and the MCP server at /mcp.
  - name: Clerk
    icon: siClerk
    why: one sign-in across the app, the CLI and your AI's connector.
  - name: MCP
    icon: siModelcontextprotocol
    why: how your AI gets to your tasks, with OAuth for Claude and ChatGPT.
architecture:
  - title: one parser everywhere
    body: a shared core package holds the quick-add parser, dates, repeats and reminders with no React, so every surface reads "tue 9am for 1h" or "every weekday" the same way.
  - title: one backend, four ways in
    body: the app, the CLI and the MCP server all call the same Convex functions, so a task Claude adds shows up on your phone right away.
  - title: plans wait for a yes
    body: propose_plan saves your AI's blocks as a proposal. they show up outlined on the week, and nothing becomes a real task until you accept, unless you tell kriyan to let agents edit directly.
