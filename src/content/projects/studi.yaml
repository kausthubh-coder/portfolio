name: Studi
order: 1
year: 2026
status: beta
logo: ./studi/logo.png
angle: -6
description: does your homework on your school's site while you watch
platforms: windows and mac
summary: >-
  studi is a desktop app with a little agent in it called inky. inky signs into your school portal through your own
  browser, finds what's due, reads the instructions and rubrics, and works on the actual assignment page in front of
  you. you can take over whenever you want, and it stops before submit, so you're the one who hands it in.
links:
  - label: join the beta
    href: https://getstudi.com/
  - label: github
    href: https://github.com/kausthubh-coder/inky
previews:
  - src: ./studi/01-week.webp
    alt: Studi week view with this week's assignments laid out by day and Inky at the top
    title: your week
    caption: inky checks your classes and lays out everything due this week.
  - src: ./studi/02-assignment.webp
    alt: An assignment open in Studi, with the school page on the left and Inky's notes on the right
    title: an assignment
    caption: the school page on the left, inky's work and a chat on the right. drafts get saved, never submitted.
  - src: ./studi/03-school-check.webp
    alt: Studi school check saying you're all caught up
    title: school check
    caption: a scan of every class, so nothing new slips past you.
features:
  - title: finds what's due
    body: it checks your classes through your own signed-in school browser, reads PDF instructions and rubrics, and lays out your week.
  - title: works where you can see it
    body: the homework happens on the school page in front of you. take over whenever you want, and it never hits submit for you.
  - title: a tutor, coming next
    body: short lessons from your syllabus or a topic you pick, with marked answers, for when you'd rather learn the thing.
story:
  - AI homework tools usually make you paste your schoolwork into a box and hope. I wanted the page to stay in front of you, so you see what the agent sees and watch what it writes.
  - your classes, drafts and memory live on your computer, not in someone's cloud. and you're still the one who submits.
stack:
  - name: Electron
    icon: siElectron
    why: a real school browser inside the app, so your password never leaves your machine.
  - name: React
    icon: siReact
    why: the app UI, built with Vite.
  - name: SQLite
    icon: siSqlite
    why: tasks, drafts and memory stay local.
  - name: Convex
    icon: siConvex
    why: accounts, beta access and the waitlist.
  - name: Clerk
    icon: siClerk
    why: sign-in on desktop.
architecture:
  - title: your browser, not ours
    body: the school page runs in a browser view inside the app, signed in as you. the agent drives that page with browser tools, and you can take it back mid-step.
  - title: local first
    body: tasks, drafts and the agent's memory are SQLite and markdown on your disk. the server only knows who you are and whether you're in the beta.
  - title: signed builds on every tag
    body: Electron Forge and GitHub Actions ship signed windows and mac builds, so updates are boring.
