name: Amy
order: 6
year: 2026
status: live
logo: ./amy/logo.png
angle: 7
description: android calorie tracker where you just type what you ate
platforms: android
license: GPL-3.0-or-later
summary: >-
  amy is a calorie tracker built on something you already do, writing a list. each line becomes an entry with
  calories and macros you can still edit. AI estimates are there if you bring your own key, but you don't need one:
  type "latte 190 cal" and amy remembers it next time. no account, no ads, and the diary stays on your phone.
links:
  - label: get amy
    href: https://openamy.app/
  - label: github
    href: https://github.com/kausthubh-coder/amy
  - label: latest apk
    href: https://github.com/kausthubh-coder/amy/releases/latest
numbers:
  - value: "10"
    label: releases since june
  - value: "0"
    label: accounts, ads or tracking SDKs
