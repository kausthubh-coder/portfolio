<!doctype html>
<!-- The stage the peek clips are rendered on. render.mjs loads this page, builds one
     storyboard from stories.js, and screenshots it frame by frame. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Sora";
        font-weight: 300 800;
        src: url("../../public/fonts/sora-latin-variable.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: relative;
        overflow: hidden;
        font-family: "Sora", system-ui, sans-serif;
      }
      #stage * {
        box-sizing: border-box;
      }
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        will-change: transform, opacity;
      }
      .caption {
        position: absolute;
        left: 50%;
        bottom: 36px;
        padding: 14px 26px;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.88);
        color: #fafafa;
        font-size: 34px;
        font-weight: 560;
        letter-spacing: -0.01em;
        white-space: nowrap;
        transform-origin: 50% 100%;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 32px -8px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="engine.js"></script>
    <script src="stories.js"></script>
  </body>
</html>
